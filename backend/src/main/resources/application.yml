server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: always

spring:
  application:
    name: gendaz-leads
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gendaz}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 300000
      idle-timeout: 120000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  security:
    user:
      name: disabled
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

app:
  env: ${APP_ENV:dev}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key-min-32-chars}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    rate-limit:
      requests-per-window: ${RATE_LIMIT_REQUESTS:200}
      window-seconds: ${RATE_LIMIT_WINDOW:60}
  limits:
    min-leads: ${MIN_LEADS_PER_REQUEST:3}
    max-leads: ${MAX_LEADS_PER_REQUEST:30}
    discovery-multiplier: ${DISCOVERY_MULTIPLIER:3}
  discovery:
    osm:
      enabled: ${OSM_ENABLED:true}
      timeout-ms: ${OSM_TIMEOUT_MS:30000}
      overpass-url: ${OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}
      fallback-url: ${OSM_OVERPASS_FALLBACK_URL:}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    enabled: ${GROQ_ENABLED:true}
    timeout-ms: ${GROQ_TIMEOUT_MS:30000}
    max-retries: ${GROQ_MAX_RETRIES:2}
  messaging:
    provider: ${MESSAGING_PROVIDER:whatsapp}
    send-interval-seconds: ${SEND_INTERVAL_SECONDS:60}
    max-concurrent-sends: ${MAX_CONCURRENT_SENDS:1}
  whatsapp:
    service-url: ${WHATSAPP_SERVICE_URL:}
    internal-token: ${WHATSAPP_INTERNAL_TOKEN:}
    session-id: ${WHATSAPP_SESSION_ID:gendaz-leads}
    timeout-ms: ${WHATSAPP_TIMEOUT_MS:15000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.gendaz.leads: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
