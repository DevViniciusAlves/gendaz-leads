server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: always

spring:
  application:
    name: gendaz-leads
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gendaz}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 300000
      idle-timeout: 120000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  security:
    user:
      name: disabled
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

app:
  env: ${APP_ENV:dev}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key-min-32-chars}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    rate-limit:
      requests-per-window: ${RATE_LIMIT_REQUESTS:200}
      window-seconds: ${RATE_LIMIT_WINDOW:60}
  limits:
    min-leads: ${MIN_LEADS_PER_REQUEST:3}
    max-leads: ${MAX_LEADS_PER_REQUEST:30}
    discovery-multiplier: ${DISCOVERY_MULTIPLIER:3}
  discovery:
    osm:
      enabled: ${OSM_ENABLED:true}
      timeout-ms: ${OSM_TIMEOUT_MS:10000}

      nominatim-timeout-ms: ${OSM_NOMINATIM_TIMEOUT_MS:8000}
      nominatim-max-attempts: ${OSM_NOMINATIM_MAX_ATTEMPTS:2}
      nominatim-cache-seconds: ${OSM_NOMINATIM_CACHE_SECONDS:3600}
      nominatim-min-interval-ms: ${OSM_NOMINATIM_MIN_INTERVAL_MS:1000}
      nominatim-base-url: ${OSM_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
      nominatim-429-backoff-ms: ${OSM_NOMINATIM_429_BACKOFF_MS:3000}

      base-budget-ms: ${OSM_DISCOVERY_BASE_BUDGET_MS:90000}
      per-lead-budget-ms: ${OSM_DISCOVERY_PER_LEAD_BUDGET_MS:3000}
      max-budget-ms: ${OSM_DISCOVERY_MAX_BUDGET_MS:180000}

      query-min-raw-limit: ${OSM_QUERY_MIN_RAW_LIMIT:40}
      query-raw-per-lead: ${OSM_QUERY_RAW_PER_LEAD:8}

      query-max-edge-km: ${OSM_QUERY_MAX_EDGE_KM:12.0}
      failure-split-threshold-km: ${OSM_FAILURE_SPLIT_THRESHOLD_KM:6.0}
      adaptive-max-depth: ${OSM_ADAPTIVE_MAX_DEPTH:12}
      adaptive-min-edge-km: ${OSM_ADAPTIVE_MIN_EDGE_KM:1.0}
      overpass-endpoints: ${OSM_OVERPASS_ENDPOINTS:https://overpass.private.coffee/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter,https://overpass-api.de/api/interpreter}
      overpass-url: ${OSM_OVERPASS_URL:}
      fallback-url: ${OSM_OVERPASS_FALLBACK_URL:}
      max-concurrency: ${OSM_OVERPASS_MAX_CONCURRENCY:1}
      circuit-open-seconds: ${OSM_CIRCUIT_OPEN_SECONDS:30}
      rate-limit-cooldown-seconds: ${OSM_429_COOLDOWN_SECONDS:60}
  enrichment:
    connect-timeout-ms: ${LEAD_ENRICHMENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LEAD_ENRICHMENT_READ_TIMEOUT_MS:3000}
    max-bytes: ${LEAD_ENRICHMENT_MAX_BYTES:500000}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    enabled: ${GROQ_ENABLED:true}
    timeout-ms: ${GROQ_TIMEOUT_MS:30000}
    max-retries: ${GROQ_MAX_RETRIES:2}
  messaging:
    provider: ${MESSAGING_PROVIDER:whatsapp}
    send-interval-seconds: ${SEND_INTERVAL_SECONDS:60}
    max-concurrent-sends: ${MAX_CONCURRENT_SENDS:1}
  whatsapp:
    service-url: ${WHATSAPP_SERVICE_URL:}
    internal-token: ${WHATSAPP_INTERNAL_TOKEN:}
    session-id: ${WHATSAPP_SESSION_ID:gendaz-leads}
    timeout-ms: ${WHATSAPP_TIMEOUT_MS:15000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.gendaz.leads: ${APP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
