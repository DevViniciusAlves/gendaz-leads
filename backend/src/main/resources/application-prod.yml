spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

app:
  env: ${APP_ENV:prod}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://gendaz-leads.vercel.app}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    rate-limit:
      requests-per-window: ${RATE_LIMIT_REQUESTS:120}
      window-seconds: ${RATE_LIMIT_WINDOW:60}
  limits:
    min-leads: ${MIN_LEADS_PER_REQUEST:3}
    max-leads: ${MAX_LEADS_PER_REQUEST:30}
    discovery-multiplier: ${DISCOVERY_MULTIPLIER:3}
  discovery:
    osm:
      enabled: ${OSM_ENABLED:true}
      timeout-ms: ${OSM_TIMEOUT_MS:10000}
      nominatim-timeout-ms: ${OSM_NOMINATIM_TIMEOUT_MS:8000}
      nominatim-max-attempts: ${OSM_NOMINATIM_MAX_ATTEMPTS:2}
      nominatim-cache-seconds: ${OSM_NOMINATIM_CACHE_SECONDS:3600}
      nominatim-min-interval-ms: ${OSM_NOMINATIM_MIN_INTERVAL_MS:1000}
      base-budget-ms: ${OSM_DISCOVERY_BASE_BUDGET_MS:90000}
      per-lead-budget-ms: ${OSM_DISCOVERY_PER_LEAD_BUDGET_MS:3000}
      max-budget-ms: ${OSM_DISCOVERY_MAX_BUDGET_MS:180000}
      query-min-raw-limit: ${OSM_QUERY_MIN_RAW_LIMIT:40}
      query-raw-per-lead: ${OSM_QUERY_RAW_PER_LEAD:8}
      query-max-edge-km: ${OSM_QUERY_MAX_EDGE_KM:12.0}
      failure-split-threshold-km: ${OSM_FAILURE_SPLIT_THRESHOLD_KM:6.0}
      adaptive-max-depth: ${OSM_ADAPTIVE_MAX_DEPTH:12}
      adaptive-min-edge-km: ${OSM_ADAPTIVE_MIN_EDGE_KM:1.0}
      overpass-endpoints: ${OSM_OVERPASS_ENDPOINTS:https://overpass.private.coffee/api/interpreter,https://maps.mail.ru/osm/tools/overpass/api/interpreter,https://overpass-api.de/api/interpreter}
      overpass-url: ${OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}
      fallback-url: ${OSM_OVERPASS_FALLBACK_URL:}
      max-concurrency: ${OSM_OVERPASS_MAX_CONCURRENCY:1}
      circuit-open-seconds: ${OSM_CIRCUIT_OPEN_SECONDS:30}
      rate-limit-cooldown-seconds: ${OSM_429_COOLDOWN_SECONDS:60}
  groq:
    api-key: ${GROQ_API_KEY}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    enabled: ${GROQ_ENABLED:true}
    timeout-ms: ${GROQ_TIMEOUT_MS:30000}
    max-retries: ${GROQ_MAX_RETRIES:2}
  messaging:
    provider: ${MESSAGING_PROVIDER:whatsapp}
    send-interval-seconds: ${SEND_INTERVAL_SECONDS:60}
    max-concurrent-sends: ${MAX_CONCURRENT_SENDS:1}
