name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Test and build backend
        working-directory: backend
        run: mvn -B clean verify

  backend-startup-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run backend startup smoke
        run: bash .github/scripts/backend_smoke.sh

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  wpp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: whatsapp-service/package-lock.json
      - name: Test WPP Service
        working-directory: whatsapp-service
        run: |
          npm ci
          npm test

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker build -f backend/Dockerfile backend -t gendaz-leads-backend-ci

  wpp-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WPP Docker Image
        run: docker build -f whatsapp-service/Dockerfile whatsapp-service -t gendaz-leads-whatsapp-ci

  osm-python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --no-cache-dir psycopg2-binary
      - name: Run Python tests
        run: |
          python3 -m unittest discover -s .github/scripts -p "test_*.py"

  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint v1.7.12
        run: |
          curl -fsSL \
            -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz

          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum -c -

          tar -xzf /tmp/actionlint.tar.gz -C /tmp

          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint -color

  osm-fixture-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install osmium
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Run osmium fixture pipeline
        run: |
          osmium tags-filter \
            --expressions=.github/osm-catalog-filter.txt \
            .github/fixtures/small-businesses.osm \
            -o /tmp/filtered.osm.pbf

          osmium export \
            /tmp/filtered.osm.pbf \
            --geometry-types=point,linestring,polygon \
            --attributes=type,id,timestamp \
            --format-option=print_record_separator=false \
            -f geojsonseq \
            -o /tmp/exported.geojsonseq

          python3 \
            .github/scripts/verify_osmium_fixture.py \
            /tmp/exported.geojsonseq