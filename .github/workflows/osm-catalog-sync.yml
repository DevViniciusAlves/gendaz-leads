name: OSM Catalog Sync

on:
  workflow_dispatch:
    inputs:
      sync_run_id:
        description: 'ID da execução de sincronização'
        required: true
        type: string
      region_id:
        description: 'ID da região no catálogo'
        required: true
        type: string
      target_id:
        description: 'ID do target cidade+nicho (vazio = legado)'
        required: false
        type: string
      city:
        description: 'Nome da cidade'
        required: true
        type: string
      state:
        description: 'Estado (UF ou nome completo)'
        required: true
        type: string
      country_code:
        description: 'Código do país (ISO2)'
        required: true
        type: string
      osm_type:
        description: 'Tipo OSM (relation, way, node)'
        required: true
        type: string
      osm_id:
        description: 'ID OSM'
        required: true
        type: string
      geofabrik_region:
        description: 'Região Geofabrik (centro-oeste, nordeste, norte, sudeste, sul)'
        required: true
        type: string
      requested_niche:
        description: 'Nicho solicitado (ex: barbearias, nail designer)'
        required: true
        type: string
      canonical_niche:
        description: 'Nicho canônico resolvido'
        required: true
        type: string
      target_valid:
        description: 'Quantidade de novos leads válidos'
        required: true
        type: string
      niche_strategy_json:
        description: 'Estratégia serializada do NicheMapper'
        required: true
        type: string

concurrency:
  group: osm-catalog-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OSM_SYNC_DATABASE_URL: ${{ secrets.OSM_SYNC_DATABASE_URL }}
      SYNC_RUN_ID: ${{ github.event.inputs.sync_run_id }}
      REGION_ID: ${{ github.event.inputs.region_id }}
      TARGET_ID: ${{ github.event.inputs.target_id }}
      CITY: ${{ github.event.inputs.city }}
      STATE: ${{ github.event.inputs.state }}
      COUNTRY_CODE: ${{ github.event.inputs.country_code }}
      OSM_TYPE: ${{ github.event.inputs.osm_type }}
      OSM_ID: ${{ github.event.inputs.osm_id }}
      GEOFABRIK_REGION: ${{ github.event.inputs.geofabrik_region }}
      REQUESTED_NICHE: ${{ github.event.inputs.requested_niche }}
      CANONICAL_NICHE: ${{ github.event.inputs.canonical_niche }}
      TARGET_VALID: ${{ github.event.inputs.target_valid }}
      NICHE_STRATEGY_JSON: ${{ github.event.inputs.niche_strategy_json }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      OSM_SYNC_WEBSITE_MAX_WORKERS: "8"
      OSM_SYNC_SOCIAL_MAX_WORKERS: "4"
      OSM_SYNC_SOCIAL_PUBLIC_FETCH_ENABLED: "true"
      OSM_SYNC_CONTACT_HUBS_ENABLED: "true"
      OSM_SYNC_WHATSAPP_SERVICE_URL: ${{ secrets.OSM_SYNC_WHATSAPP_SERVICE_URL }}
      OSM_SYNC_WHATSAPP_INTERNAL_TOKEN: ${{ secrets.OSM_SYNC_WHATSAPP_INTERNAL_TOKEN }}
      OSM_SYNC_WHATSAPP_CHECK_INTERVAL_MS: "350"
      OSM_SYNC_WHATSAPP_CHECK_MAX_ATTEMPTS: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool postgresql-client curl ca-certificates

      - name: Build Java backend (batch + preflight)
        working-directory: backend
        run: mvn -B -q compile -DskipTests

      - name: Validate inputs
        run: |
          # Validate numeric inputs
          if ! [[ "$SYNC_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: SYNC_RUN_ID must be numeric"
            exit 1
          fi
          if ! [[ "$REGION_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: REGION_ID must be numeric"
            exit 1
          fi
          if [ -n "$TARGET_ID" ] && ! [[ "$TARGET_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: TARGET_ID must be numeric when provided"
            exit 1
          fi
          if ! [[ "$OSM_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: OSM_ID must be numeric"
            exit 1
          fi
          # Validate country code
          if [[ "$COUNTRY_CODE" != "br" ]]; then
            echo "ERROR: COUNTRY_CODE must be 'br'"
            exit 1
          fi
          # Validate geofabrik region
          case "$GEOFABRIK_REGION" in
            centro-oeste|nordeste|norte|sudeste|sul) ;;
            *) echo "ERROR: Invalid GEOFABRIK_REGION"; exit 1 ;;
          esac
          # Validate OSM type (municipal catalog sync requires a relation)
          if [[ "$OSM_TYPE" != "relation" ]]; then
            echo "ERROR: OSM_TYPE must be relation for municipal catalog sync"
            exit 1
          fi
          echo "[osm-sync] inputs_validated"

      - name: Validate environment
        run: |
          if [ -z "$OSM_SYNC_DATABASE_URL" ]; then
            echo "ERROR: OSM_SYNC_DATABASE_URL secret not configured"
            exit 1
          fi
          if [ -z "$OSM_SYNC_WHATSAPP_SERVICE_URL" ]; then
            echo "ERROR: OSM_SYNC_WHATSAPP_SERVICE_URL secret not configured (qualified pool requires WhatsApp check)"
            exit 1
          fi
          if [ -z "$OSM_SYNC_WHATSAPP_INTERNAL_TOKEN" ]; then
            echo "ERROR: OSM_SYNC_WHATSAPP_INTERNAL_TOKEN secret not configured (qualified pool requires WhatsApp check)"
            exit 1
          fi
          if [ -z "$CANONICAL_NICHE" ]; then
            echo "ERROR: CANONICAL_NICHE must be provided (qualified pool is niche-scoped)"
            exit 1
          fi
          if ! [[ "$TARGET_VALID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: TARGET_VALID must be numeric"
            exit 1
          fi
          echo "[osm-sync] start sync_run_id=$SYNC_RUN_ID region_id=$REGION_ID target_id=$TARGET_ID city=$CITY state=$STATE country_code=$COUNTRY_CODE osm_type=$OSM_TYPE osm_id=$OSM_ID geofabrik_region=$GEOFABRIK_REGION"

      - name: Validate WhatsApp session (Java preflight)
        working-directory: backend
        run: mvn -B -q exec:java -Dexec.mainClass=com.gendaz.leads.osm.batch.OsmPreflightMain

      - name: Update sync run to RUNNING
        run: |
          psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            UPDATE osm_sync_runs
            SET status = 'RUNNING', started_at = NOW(), github_run_id = $GITHUB_RUN_ID
            WHERE id = $SYNC_RUN_ID;
          "
          psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            UPDATE osm_catalog_regions
            SET
                last_error = NULL,
                last_attempt_at = NOW(),
                updated_at = NOW()
            WHERE id = $REGION_ID;
          "

      - name: Download PBF extract
        id: download
        run: |
          PBF_URL="https://download.geofabrik.de/south-america/brazil/${GEOFABRIK_REGION}-latest.osm.pbf"
          CHECKSUM_URL="${PBF_URL}.md5"
          PBF_FILE="${GEOFABRIK_REGION}-latest.osm.pbf"

          echo "[osm-sync] download_start url=$PBF_URL"
          curl -fL --retry 3 --retry-delay 5 -o "$PBF_FILE" "$PBF_URL"

          echo "[osm-sync] downloading checksum"
          curl -fL --retry 3 --retry-delay 5 -o "${PBF_FILE}.md5" "$CHECKSUM_URL"

          EXPECTED=$(awk '{print $1}' "${PBF_FILE}.md5")
          ACTUAL=$(md5sum "$PBF_FILE" | awk '{print $1}')

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "[osm-sync] checksum_failed"
            psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE osm_sync_runs
              SET status = 'FAILED', finished_at = NOW(), error_message = 'PBF_CHECKSUM_FAILED: checksum validation failed for PBF download'
              WHERE id = $SYNC_RUN_ID;
            "
            exit 1
          fi

          echo "[osm-sync] checksum_ok"

      - name: Validate PBF with osmium
        run: |
          PBF_FILE="${GEOFABRIK_REGION}-latest.osm.pbf"
          echo "[osm-sync] validating PBF with osmium"
          osmium --version
          osmium fileinfo "$PBF_FILE" || {
            echo "[osm-sync] osmium fileinfo failed"
            psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE osm_sync_runs
              SET status = 'FAILED', finished_at = NOW(), error_message = 'PBF_DOWNLOAD_FAILED: osmium fileinfo validation failed'
              WHERE id = $SYNC_RUN_ID;
            "
            exit 1
          }

      - name: Extract administrative boundary from PBF
        run: |
          PBF_FILE="${GEOFABRIK_REGION}-latest.osm.pbf"

          echo "[osm-sync] extracting boundary relation from PBF osm_id=$OSM_ID"

          osmium getid \
            -r \
            "$PBF_FILE" \
            "r${OSM_ID}" \
            -o boundary.osm.pbf || {
            echo "[osm-sync] boundary getid failed"
            psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE osm_sync_runs
              SET status = 'FAILED', finished_at = NOW(), error_message = 'BOUNDARY_NOT_FOUND: OSM boundary relation r${OSM_ID} not found or incomplete in ${GEOFABRIK_REGION} PBF'
              WHERE id = $SYNC_RUN_ID;
            "
            exit 1
          }

          echo "[osm-sync] validating boundary relation"

          osmium fileinfo boundary.osm.pbf || {
            echo "[osm-sync] boundary fileinfo failed"
            psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE osm_sync_runs
              SET status = 'FAILED', finished_at = NOW(), error_message = 'BOUNDARY_INVALID: OSM boundary relation r${OSM_ID} fileinfo validation failed'
              WHERE id = $SYNC_RUN_ID;
            "
            exit 1
          }

          echo "[osm-sync] boundary_relation_ok"

      - name: Extract city from PBF
        run: |
          PBF_FILE="${GEOFABRIK_REGION}-latest.osm.pbf"

          echo "[osm-sync] extracting city with osmium"

          osmium extract \
            -p boundary.osm.pbf \
            -s smart \
            -S types=multipolygon,boundary \
            "$PBF_FILE" \
            -o city.osm.pbf || {
            echo "[osm-sync] city extract failed"
            psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE osm_sync_runs
              SET status = 'FAILED', finished_at = NOW(), error_message = 'CITY_EXTRACT_FAILED: OSM city extraction failed using relation r${OSM_ID}'
              WHERE id = $SYNC_RUN_ID;
            "
            exit 1
          }

          echo "[osm-sync] city_extract_ok"

      - name: Filter commercial and contact-bearing OSM objects
        run: |
          echo "[osm-sync] filtering commercial and contact-bearing OSM objects"

          osmium tags-filter \
            --expressions=.github/osm-catalog-filter.txt \
            city.osm.pbf \
            -o city-commercial.osm.pbf || {
            echo "[osm-sync] catalog filter failed"
            psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE osm_sync_runs
              SET status = 'FAILED',
                  finished_at = NOW(),
                  error_message = 'CATALOG_FILTER_FAILED: osmium tags-filter failed'
              WHERE id = $SYNC_RUN_ID;
            "
            exit 1
          }

          echo "[osm-sync] catalog_filter_ok"

      - name: Export to GeoJSONSeq
        run: |
          echo "[osm-sync] exporting to GeoJSONSeq"

          osmium export city-commercial.osm.pbf \
            --geometry-types=point,linestring,polygon \
            --attributes=type,id,timestamp \
            --format-option=print_record_separator=false \
            -f geojsonseq \
            -o city-commercial.geojsonseq || {
            echo "[osm-sync] geojson export failed"
            psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE osm_sync_runs
              SET status = 'FAILED', finished_at = NOW(), error_message = 'GEOJSON_EXPORT_FAILED: osmium export failed'
              WHERE id = $SYNC_RUN_ID;
            "
            exit 1
          }

          echo "[osm-sync] geojsonseq_export_ok"

      - name: Run Java OSM sync batch (full lead pipeline)
        working-directory: backend
        run: |
          echo "[osm-sync] java_batch_start"
          mvn -B -q exec:java \
            -Dexec.mainClass=com.gendaz.leads.osm.batch.OsmSyncBatchMain \
            -Dexec.args="--sync-run-id $SYNC_RUN_ID --region-id $REGION_ID --target-id ${TARGET_ID:-0} --city $CITY --state $STATE --country-code $COUNTRY_CODE --canonical-niche $CANONICAL_NICHE --target-valid $TARGET_VALID --niche-strategy-json $NICHE_STRATEGY_JSON --input ../city-commercial.geojsonseq"

      - name: Update sync run SUCCESS
        if: success()
        run: |
          echo "[osm-sync] publish_success (handled by Java batch)"

      - name: Update sync run FAILED
        if: failure()
        run: |
          if [ -z "${OSM_SYNC_DATABASE_URL:-}" ]; then
            echo "[osm-sync] failed before database connection was available"
            exit 0
          fi

          psql "$OSM_SYNC_DATABASE_URL" -v ON_ERROR_STOP=1 <<SQL
          UPDATE osm_sync_runs
          SET
              status = 'FAILED',
              finished_at = NOW(),
              error_message = COALESCE(
                  error_message,
                  'SYNC_FAILED: Java batch failed before catalog publish'
              )
          WHERE id = $SYNC_RUN_ID
            AND status NOT IN ('SUCCESS', 'PARTIAL', 'EXHAUSTED');

          UPDATE osm_catalog_regions
          SET
              last_error = COALESCE(
                  (
                      SELECT error_message
                      FROM osm_sync_runs
                      WHERE id = $SYNC_RUN_ID
                  ),
                  'SYNC_FAILED: Java batch failed before catalog publish'
              ),
              last_attempt_at = NOW(),
              updated_at = NOW()
          WHERE id = $REGION_ID;
          SQL

          echo "[osm-sync] failed"
